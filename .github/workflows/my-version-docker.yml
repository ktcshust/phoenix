name: "[my-version] Build & Push Docker to Docker Hub"

on:
  push:
    branches:
      - my-version
  workflow_dispatch:

jobs:
  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Đổi thành Docker Hub username của bạn
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: phoenix

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract short commit hash
        id: commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag bằng commit hash + latest để dễ rollback
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:my-version
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:my-version-${{ steps.commit.outputs.SHORT_SHA }}
          # Cache layer để build nhanh hơn ở lần sau
          cache-from: type=gha
          cache-to: type=gha,mode=max
